<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Ink Anywhere — E-Ink Style Web Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="board">
    <header class="board-header">
      <div class="date-block">
        <div id="date-main" class="date-main">---- --, ----</div>
        <div id="date-sub" class="date-sub">---</div>
      </div>
      <div class="clock-block">
        <div id="clock" class="clock">--:--</div>
        <div class="clock-label">Local time</div>
      </div>
    </header>

    <div class="columns">
      <div class="col col-left">
        <section class="panel weather-panel">
          <h2 id="weather-title">Weather · Shanghai</h2>
          <div id="weather-now" class="weather-now">Loading weather…</div>
          <div id="weather-days" class="weather-days"></div>
        </section>

        <section class="panel news-panel">
          <h2>Top Headlines</h2>
          <ol id="news-list" class="news-list">
            <li>Loading news…</li>
          </ol>
        </section>
      </div>

      <div class="col col-right">
        <section class="panel poem-panel">
          <h2>Poem of the Day</h2>
          <div id="poem" class="poem"></div>
        </section>

        <section class="panel calendar-panel">
          <h2 id="calendar-title">Calendar</h2>
          <div id="calendar" class="calendar"></div>
        </section>
      </div>
    </div>

    <footer class="board-footer">
      <span>E-Ink Anywhere · Low refresh · Paper feel</span>
      <span id="updated-at"></span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
